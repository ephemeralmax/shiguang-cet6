<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'none';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拾光六级 · CET-6 Study Space</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <button class="brand" data-action="nav" data-page="dashboard" aria-label="返回首页">
        <span class="brand-mark"><span></span><span></span><span></span></span>
        <span class="brand-copy"><strong>拾光六级</strong><small>CET-6 STUDY SPACE</small></span>
      </button>

      <nav class="main-nav" aria-label="主导航">
        <p class="nav-label">学习空间</p>
        <button class="nav-item active" data-action="nav" data-page="dashboard"><span data-icon="home"></span><span>今日概览</span></button>
        <button class="nav-item" data-action="nav" data-page="vocab"><span data-icon="book"></span><span>六级词汇</span><span id="nav-word-badge" class="nav-badge">8</span></button>
        <button class="nav-item" data-action="nav" data-page="phrases"><span data-icon="chat"></span><span>常用短语</span></button>
        <button class="nav-item" data-action="nav" data-page="translation"><span data-icon="translate"></span><span>翻译练习</span></button>
        <button class="nav-item" data-action="nav" data-page="essay"><span data-icon="edit"></span><span>作文模板</span></button>
      </nav>

      <div class="sidebar-spacer"></div>
      <section class="goal-card" aria-label="今日学习目标">
        <div class="goal-heading"><span data-icon="target"></span><span>今日目标</span><span id="goal-percent">0%</span></div>
        <div class="goal-body">
          <div id="goal-ring" class="goal-ring"><div><strong id="goal-count">0</strong><small id="goal-target">/ 20</small></div></div>
          <p>小步不停，<br>自有回响。<br><button class="goal-edit-btn" data-action="edit-goal" title="设置目标">⚙ 设置目标</button></p>
        </div>
        <div class="goal-track"><span id="goal-track-fill"></span></div>
      </section>
      <div class="sidebar-footer"><span class="save-dot"></span><span id="save-hint">所有数据已保存在本机</span></div>
      <p class="keyboard-tip">Ctrl K 搜索 · Ctrl 1-5 切换 · Ctrl R 复习</p>
    </aside>

    <main class="main-shell">
      <header class="topbar">
        <div class="breadcrumb"><span>学习空间</span><span class="breadcrumb-slash">/</span><strong id="page-name">今日概览</strong></div>
        <div class="topbar-actions">
          <button class="search-trigger" data-action="global-search"><span data-icon="search"></span><span>搜索学习内容</span><kbd>Ctrl K</kbd></button>
          <span class="topbar-divider"></span>
          <div class="today-date"><span data-icon="calendar"></span><span id="today-date"></span></div>
          <div class="avatar" title="本地学习者">Y</div>
        </div>
      </header>
      <div id="content" class="content"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="data/words.js"></script>
  <script src="data/phrases.js"></script>
  <script src="data/translations.js"></script>
  <script src="data/templates.js"></script>
  <script src="data/writing.js"></script>
  <script src="data/idmap.js"></script>
  <script src="study-core.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
